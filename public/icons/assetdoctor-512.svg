<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Canvas Background for Android Adaptive Masking -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Main Edge-to-Edge Glassmorphic Shield Card -->
  <rect x="48" y="48" width="416" height="416" rx="96" 
        fill="url(#glassGrad)" 
        stroke="url(#rimGrad)" 
        stroke-width="5" 
        filter="url(#popShadow)"/>

  <!-- Futuristic Corner Markers -->
  <g stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 96 140 L 96 116 Q 96 96 116 96 L 140 96"/>
    <path d="M 372 96 L 396 96 Q 416 96 416 116 L 416 140"/>
    <path d="M 96 372 L 96 396 Q 96 416 116 416 L 140 416"/>
    <path d="M 372 416 L 396 416 Q 416 416 416 396 L 416 372"/>
  </g>

  <!-- Central Shield Crest -->
  <path d="M 256 120 C 325 120 365 145 365 225 C 365 315 288 375 256 398 C 224 375 147 315 147 225 C 147 145 187 120 256 120 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="9" 
        stroke-linejoin="round" 
        opacity="0.45"/>

  <!-- Central Doctor Cross + ECG Pulse Wave -->
  <g filter="url(#neonGlow)">
    <path d="M 226 195 H 286 V 226 H 317 V 286 H 286 V 317 H 226 V 286 H 195 V 226 H 226 Z" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="10" 
          stroke-linejoin="round"/>
    
    <path d="M 175 256 H 218 L 234 228 L 250 282 L 268 244 L 280 256 H 337" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
